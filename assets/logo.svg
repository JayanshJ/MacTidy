<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MacTidy">
  <defs>
    <linearGradient id="sheen" x1="256" y1="0" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle plate, app teal accent.
       Inset ~18pt per side so the icon matches the visual weight of Apple's
       app-icon template (which carries internal padding) instead of reading
       "weirdly bigger" than neighboring dock icons. The corner radius scales
       to the smaller plate. -->
  <rect x="18" y="18" width="476" height="476" rx="108" fill="#1FA0A0"/>
  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#sheen)"/>

  <!-- a single disk, mostly empty = space reclaimed.
       Proportionally smaller so the glyph keeps its margin inside the plate.
       fill + fill-opacity (and stroke + stroke-opacity) are set per element
       on purpose — inheriting from a parent <g> makes macOS's NSImage SVG
       parser drop opacity, flattening the icon when generating AppIcon.icns. -->
  <circle cx="256" cy="256" r="116" fill="none" stroke="#FFFFFF" stroke-width="42"/>
  <path d="M256 140 A116 116 0 0 1 372 256" fill="none"
        stroke="#FFFFFF" stroke-width="42" stroke-opacity="0.38" stroke-linecap="round"/>
</svg>