<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MacTidy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="0" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle plate -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- treemap blocks: what MacTidy keeps.
       fill + fill-opacity are set per element on purpose — inheriting `fill`
       from a parent <g> makes macOS's NSImage SVG parser drop fill-opacity,
       which flattens the icon to solid white when generating AppIcon.icns. -->
  <rect x="128" y="128" width="148" height="148" rx="18" fill="#FFFFFF" fill-opacity="0.97"/>
  <rect x="288" y="128" width="96"  height="68"  rx="16" fill="#FFFFFF" fill-opacity="0.80"/>
  <rect x="288" y="208" width="96"  height="68"  rx="16" fill="#FFFFFF" fill-opacity="0.66"/>
  <rect x="288" y="288" width="96"  height="96"  rx="16" fill="#FFFFFF" fill-opacity="0.52"/>

  <!-- the block that just got reclaimed -->
  <rect x="134" y="294" width="136" height="84" rx="16"
        fill="#FFFFFF" fill-opacity="0.13"
        stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="11"/>

  <!-- sparkles: the space coming back -->
  <path d="M202 306 Q208 330 226 336 Q208 342 202 366 Q196 342 178 336 Q196 330 202 306 Z" fill="#FFFFFF"/>
  <path d="M242 305 Q245 316 255 319 Q245 322 242 333 Q239 322 229 319 Q239 316 242 305 Z" fill="#FFFFFF" fill-opacity="0.88"/>
</svg>
